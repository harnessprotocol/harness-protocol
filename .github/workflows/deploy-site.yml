name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'coming-soon/**'
      - 'website/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # COMING SOON MODE
      # Deploys the static coming-soon/ directory directly — no build step needed.
      #
      # TO LAUNCH THE FULL SITE:
      #   1. Uncomment the "Install dependencies" and "Build" steps below
      #   2. Change the deploy command to: pages deploy website/build --project-name=harness-protocol
      #   3. Update the paths trigger above to remove 'coming-soon/**' if desired
      # -------------------------------------------------------------------------

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy coming-soon --project-name=harness-protocol --branch main

      # -------------------------------------------------------------------------
