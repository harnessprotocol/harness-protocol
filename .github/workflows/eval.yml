name: Eval Suite

on:
  push:
    paths: [schema/**, protocol/**, examples/**, eval/**]
  pull_request:
    paths: [schema/**, protocol/**, examples/**, eval/**]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: eval/pnpm-lock.yaml
      - run: cd eval && pnpm install --frozen-lockfile
      - run: cd eval && pnpm exec tsc --noEmit
      - run: cd eval && pnpm test
