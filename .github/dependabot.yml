version: 2
updates:
  # Monthly, grouped: minor and patch updates share one PR, majors get one PR each.
  # Every entry waits `cooldown` days after a release before Dependabot proposes it.
  # Hijacked releases are usually caught and pulled within days, so the wait keeps them
  # out. Security updates ignore the cooldown and the schedule.
  # eval/ and website/ have separate pnpm lockfiles; one group spans both.
  - package-ecosystem: "npm"
    directories:
      - "/eval"
      - "/website"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # @types/node tracks the CI runtime (Node 22); bump it by hand with node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # A backlog of security fixes arrives as one PR per ecosystem, not one per package.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
