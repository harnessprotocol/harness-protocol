<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harness Protocol</title>
  <meta name="description" content="An open specification for portable AI coding harnesses." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131c;
      --border: #1e1e2e;
      --blue: #60a5fa;
      --blue-dim: #3b82f6;
      --blue-glow: rgba(96, 165, 250, 0.12);
      --text: #e2e8f0;
      --muted: #64748b;
      --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle dot-grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #1e1e2e 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    /* Logo mark */
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      box-shadow: 0 0 24px var(--blue-glow);
    }

    .logo svg {
      width: 28px;
      height: 28px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #e2e8f0 0%, var(--blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: var(--muted);
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    /* Status badge */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--blue);
      background: var(--blue-glow);
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      margin-bottom: 3rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Links */
    .links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      transition: all 0.15s ease;
    }

    .link-primary {
      background: var(--blue-dim);
      color: #fff;
      border: 1px solid transparent;
    }

    .link-primary:hover {
      background: var(--blue);
    }

    .link-ghost {
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .link-ghost:hover {
      color: var(--text);
      border-color: var(--blue-dim);
    }

    /* Footer */
    footer {
      position: absolute;
      bottom: 2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="logo">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Harness buckle icon: two horizontal bars with a center pin -->
        <rect x="4" y="8" width="20" height="3" rx="1.5" fill="#60a5fa"/>
        <rect x="4" y="17" width="20" height="3" rx="1.5" fill="#60a5fa"/>
        <rect x="12.5" y="4" width="3" height="20" rx="1.5" fill="#3b82f6" opacity="0.7"/>
      </svg>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      Coming soon
    </div>

    <h1>Harness Protocol</h1>

    <p class="tagline">
      An open specification for portable AI coding harnesses — one validated
      <code style="font-family: var(--mono); font-size: 0.9em; color: var(--blue);">harness.yaml</code>
      that works across every tool.
    </p>

    <div class="links">
      <a class="link link-primary" href="https://harnesskit.ai">
        harness-kit ↗
      </a>
    </div>

  </div>

  <footer>
    Apache 2.0
  </footer>
</body>
</html>
